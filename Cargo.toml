[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-service-telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Privacy-bounded owner-local telemetry foundation for Crowsi services"
license = "Apache-2.0"
readme = "README.md"
publish = false
repository = "https://github.com/crowsi-net/crowsi-service-telemetry"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
crowsi-telemetry-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
getrandom = "0.3.4"
nix = { version = "0.29.0", features = ["user"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
